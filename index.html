<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartEdu Cloud | Unified Dashboard</title>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&family=JetBrains+Mono&display=swap" rel="stylesheet">

    <style>
        :root {
            --accent: #6366f1;
            --accent-glow: rgba(99, 102, 241, 0.3);
            --bg: #0b0e14;
            --card: rgba(255, 255, 255, 0.03);
            --border: rgba(255, 255, 255, 0.1);
            --text: #f1f5f9;
            --success: #10b981;
            --danger: #ef4444;
        }

        * { box-sizing: border-box; font-family: 'Outfit', sans-serif; transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
        body { background-color: var(--bg); color: var(--text); margin: 0; height: 100vh; overflow: hidden; }

        /* Auth Screen Styling */
        #auth-screen { 
            height: 100vh; display: flex; align-items: center; justify-content: center;
            background: radial-gradient(circle at center, #1e1b4b 0%, #0b0e14 100%);
        }
        .auth-glass {
            background: rgba(15, 23, 42, 0.8); backdrop-filter: blur(20px);
            padding: 3rem; border-radius: 24px; width: 420px;
            border: 1px solid var(--border); box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5);
        }

        /* Layout Structure */
        .app-shell { display: none; height: 100vh; grid-template-columns: 280px 1fr; }
        .app-shell.active { display: grid; }

        .sidebar {
            background: rgba(2, 6, 23, 0.5); border-right: 1px solid var(--border);
            padding: 30px; display: flex; flex-direction: column;
        }

        .main-view { padding: 40px; overflow-y: auto; background: var(--bg); }

        /* Glass Cards */
        .glass-card {
            background: var(--card); border: 1px solid var(--border);
            border-radius: 20px; padding: 24px; backdrop-filter: blur(10px);
            margin-bottom: 24px;
        }
        .glass-card:hover { border-color: var(--accent); background: rgba(255,255,255,0.05); }

        /* Nav & Buttons */
        .nav-link {
            padding: 14px 18px; border-radius: 12px; margin-bottom: 8px;
            cursor: pointer; display: flex; align-items: center; gap: 12px;
            color: #94a3b8; border: 1px solid transparent;
        }
        .nav-link.active { background: var(--accent); color: white; box-shadow: 0 0 20px var(--accent-glow); }
        .nav-link:hover:not(.active) { background: var(--card); color: white; }

        input, select, button {
            width: 100%; padding: 12px 16px; border-radius: 10px; margin: 8px 0;
            border: 1px solid var(--border); background: rgba(0,0,0,0.2); color: white; outline: none;
        }
        button { background: var(--accent); font-weight: 600; cursor: pointer; border: none; }
        button:hover { transform: translateY(-2px); filter: brightness(1.1); }

        /* Feature UI */
        #map { height: 350px; border-radius: 16px; border: 1px solid var(--border); }
        video { width: 100%; border-radius: 16px; background: #000; border: 1px solid var(--border); }
        .stat-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 20px; }
        
        .role-badge { 
            font-size: 0.7rem; padding: 4px 12px; border-radius: 20px; 
            background: var(--accent-glow); border: 1px solid var(--accent); color: var(--accent);
            text-transform: uppercase; letter-spacing: 1px;
        }

        .hidden { display: none; }
        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        .module { animation: slideUp 0.4s ease-out; }
    </style>
</head>
<body>

    <div id="auth-screen">
        <div class="auth-glass">
            <h1 style="margin: 0; font-weight: 600; letter-spacing: -1px;">SmartEdu <span style="color:var(--accent)">Cloud</span></h1>
            <p style="color: #64748b; margin-bottom: 30px;">Architecture Framework v2.0</p>
            
            <label style="font-size: 0.8rem; color: #94a3b8;">Select Demo Role:</label>
            <select id="login-role">
                <option value="student">🎓 Student (John Doe)</option>
                <option value="faculty">👨‍🏫 Faculty (Prof. Smith)</option>
                <option value="admin">👮 Admin (Superuser)</option>
            </select>
            <input type="email" id="login-email" placeholder="Email" value="user@edu.com">
            <input type="password" id="login-pass" placeholder="Password" value="••••••">
            <button onclick="Core.login()">Initialize Secure Login</button>
            <p id="login-msg" style="text-align:center; font-size:0.8rem; margin-top:15px;"></p>
        </div>
    </div>

    <div id="app-shell" class="app-shell">
        <aside class="sidebar">
            <div style="margin-bottom: 40px;">
                <h3 style="margin: 0;">Cloud Panel</h3>
                <span id="user-badge" class="role-badge">Role</span>
            </div>
            
            <div id="dynamic-menu" style="flex: 1;">
                </div>

            <button onclick="location.reload()" style="background: var(--danger); font-size: 0.8rem;">Logout System</button>
        </aside>

        <main class="main-view">
            <div id="content-area"></div>
        </main>
    </div>

    <script>
        const Core = {
            state: {
                user: null,
                deviceId: "SEC-DROID-8821-X",
                classroom: [12.9716, 77.5946]
            },

            // --- ROLE DASHBOARD CONTENT ---
            modules: {
                student: {
                    menu: [
                        { id: 'std_dash', label: '📊 Dashboard', icon: '🏠' },
                        { id: 'std_geo', label: '📍 Attendance', icon: '📍' },
                        { id: 'std_ai', label: '🧠 Prediction', icon: '🤖' }
                    ],
                    render: {
                        std_dash: () => `
                            <div class="module">
                                <h1>Student Analytics</h1>
                                <div class="stat-grid">
                                    <div class="glass-card"><h4>Attendance</h4><h2>84.2%</h2><progress value="84" max="100" style="width:100%"></progress></div>
                                    <div class="glass-card"><h4>Device ID</h4><code style="color:var(--success)">${Core.state.deviceId}</code><p style="font-size:0.7rem">Verified Device</p></div>
                                    <div class="glass-card"><h4>Assignments</h4><h2>12 / 14</h2></div>
                                </div>
                            </div>`,
                        std_geo: () => `
                            <div class="module">
                                <h1>Geofenced Attendance</h1>
                                <div class="stat-grid">
                                    <div class="glass-card">
                                        <h4>1. GPS Location</h4>
                                        <div id="map"></div>
                                        <button onclick="Core.verifyLocation()" style="margin-top:15px;">Verify Position</button>
                                    </div>
                                    <div class="glass-card">
                                        <h4>2. Face Validation</h4>
                                        <video id="webcam" autoplay playsinline></video>
                                        <button onclick="alert('Biometric ID Synced')" style="background:var(--success); margin-top:15px;">Capture Identity</button>
                                    </div>
                                </div>
                                <div id="geo-status" class="glass-card hidden" style="text-align:center"></div>
                            </div>`,
                        std_ai: () => `
                            <div class="module">
                                <h1>AI Performance Model</h1>
                                <div class="glass-card">
                                    <p>Adjust data points to run ML inference (Linear Regression simulation)</p>
                                    <label>Study Hours: <b id="h-val">10</b></label>
                                    <input type="range" min="1" max="20" value="10" oninput="document.getElementById('h-val').innerText=this.value; Core.runAI()">
                                    <div style="margin-top:40px; text-align:center">
                                        <h4 style="color:#94a3b8">Predicted Final Grade</h4>
                                        <h1 id="ai-result" style="font-size:5rem; color:var(--success); margin:0">B+</h1>
                                    </div>
                                </div>
                            </div>`
                    }
                },
                faculty: {
                    menu: [
                        { id: 'fac_dash', label: '👨‍🏫 My Classes', icon: '📚' },
                        { id: 'fac_reports', label: '📋 View Reports', icon: '📈' }
                    ],
                    render: {
                        fac_dash: () => `
                            <div class="module">
                                <h1>Faculty Control</h1>
                                <div class="glass-card">
                                    <h3>Active Classes</h3>
                                    <div class="nav-link" style="color:white; background:rgba(255,255,255,0.05)">CS101 - Web Technologies (Section A) <button style="width:120px; margin:0">Open Portal</button></div>
                                    <div class="nav-link" style="color:white; margin-top:10px; background:rgba(255,255,255,0.05)">CS202 - Data Structures (Section B) <button style="width:120px; margin:0">Open Portal</button></div>
                                </div>
                            </div>`,
                        fac_reports: () => `
                            <div class="module">
                                <h1>Attendance Reports</h1>
                                <div class="glass-card">
                                    <table style="width:100%; border-collapse:collapse">
                                        <tr style="color:#94a3b8; border-bottom:1px solid var(--border)">
                                            <th align="left">Student Name</th><th align="left">Roll No</th><th align="left">Status</th>
                                        </tr>
                                        <tr><td>John Doe</td><td>202401</td><td style="color:var(--success)">Present</td></tr>
                                        <tr><td>Jane Smith</td><td>202402</td><td style="color:var(--danger)">Absent</td></tr>
                                    </table>
                                </div>
                            </div>`
                    }
                },
                admin: {
                    menu: [
                        { id: 'adm_sys', label: '⚙️ System Logs', icon: '🛠️' },
                        { id: 'adm_users', label: '👥 User Manager', icon: '👤' }
                    ],
                    render: {
                        adm_sys: () => `
                            <div class="module">
                                <h1>System Administration</h1>
                                <div class="glass-card" style="font-family:'JetBrains Mono'; font-size:0.8rem; color:var(--success)">
                                    > Firebase connection: OK<br>
                                    > Geofence service: ONLINE<br>
                                    > Database Sync: 100%<br>
                                    > Active Sessions: 124
                                </div>
                            </div>`,
                        adm_users: () => `
                            <div class="module">
                                <h1>Manage Users</h1>
                                <div class="glass-card">
                                    <input placeholder="Search UID or Email...">
                                    <button style="width:auto">Add New User +</button>
                                </div>
                            </div>`
                    }
                }
            },

            // --- APP CORE LOGIC ---
            login: function() {
                const role = document.getElementById('login-role').value;
                const msg = document.getElementById('login-msg');

                // Simulation: Logic addressing your "Profile Not Found" fix
                // In Kotlin, this would be: if (firestore.document(uid).exists()) { ... }
                this.state.user = { role, name: role === 'student' ? 'John Doe' : 'Staff Member' };
                
                document.getElementById('auth-screen').style.display = 'none';
                document.getElementById('app-shell').classList.add('active');
                document.getElementById('user-badge').innerText = role;
                
                this.initSidebar(role);
            },

            initSidebar: function(role) {
                const menu = document.getElementById('dynamic-menu');
                menu.innerHTML = '';
                const config = this.modules[role];
                
                config.menu.forEach((item, idx) => {
                    const div = document.createElement('div');
                    div.className = `nav-link ${idx === 0 ? 'active' : ''}`;
                    div.innerHTML = `<span>${item.icon}</span> ${item.label}`;
                    div.onclick = () => {
                        document.querySelectorAll('.nav-link').forEach(l => l.classList.remove('active'));
                        div.classList.add('active');
                        this.loadModule(role, item.id);
                    };
                    menu.appendChild(div);
                });

                this.loadModule(role, config.menu[0].id);
            },

            loadModule: function(role, moduleId) {
                const html = this.modules[role].render[moduleId]();
                document.getElementById('content-area').innerHTML = html;
                
                // Initialize specific features
                if(moduleId === 'std_geo') {
                    this.initMap();
                    this.initWebcam();
                }
            },

            // --- FEATURE HELPERS ---
            initMap: function() {
                setTimeout(() => {
                    const map = L.map('map').setView(this.state.classroom, 16);
                    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
                    L.circle(this.state.classroom, { color: '#6366f1', radius: 100 }).addTo(map);
                    this.state.currentMap = map;
                }, 100);
            },

            verifyLocation: function() {
                navigator.geolocation.getCurrentPosition(pos => {
                    const status = document.getElementById('geo-status');
                    status.classList.remove('hidden');
                    const dist = this.state.currentMap.distance([pos.coords.latitude, pos.coords.longitude], this.state.classroom);
                    
                    if(dist < 100) {
                        status.innerHTML = `<h3 style="color:var(--success)">✅ Verification Successful</h3><p>Attendance synced to Firestore.</p>`;
                    } else {
                        status.innerHTML = `<h3 style="color:var(--danger)">❌ Location Mismatch</h3><p>You are ${Math.round(dist)}m away from class.</p>`;
                    }
                });
            },

            initWebcam: async function() {
                const video = document.getElementById('webcam');
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ video: true });
                    video.srcObject = stream;
                } catch(e) { console.warn("Webcam blocked"); }
            },

            runAI: function() {
                const res = document.getElementById('ai-result');
                const grades = ["C", "C+", "B", "B+", "A", "A+"];
                res.innerText = grades[Math.floor(Math.random() * grades.length)];
            }
        };
    </script>
</body>
</html>
